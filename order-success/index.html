<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | FreshJaipur</title>
<meta name="description" content="Your FreshJaipur order has been placed successfully.">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/shop.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<div id="navbar"></div>

<main class="shop-page">
<section class="container">
    <div class="shop-card order-success">
        <div class="success-icon"><i class="fa-solid fa-check"></i></div>
        <h1>Order Placed! 🎉</h1>
        <p>Thank you for shopping with FreshJaipur.</p>
        <div class="order-id" id="orderId">Order ID: —</div>

        <div class="order-details-box" id="orderDetails"></div>

        <div class="order-action-row">
            <a href="/vegetables/" class="shop-secondary-btn"><i class="fa-solid fa-leaf"></i> Continue Shopping</a>
            <button class="copy-btn" type="button" id="copyOrder"><i class="fa-regular fa-copy"></i> Copy Order Details</button>
            <a class="whatsapp-btn" id="whatsappOrder" target="_blank" rel="noopener" style="display:none;"><i class="fa-brands fa-whatsapp"></i> Send on WhatsApp</a>
        </div>
    </div>
</section>
</main>

<div id="footer"></div>

<script src="/js/include.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/store-config.js"></script>
<script src="/js/order-success.js"></script>
</body>
</html>
