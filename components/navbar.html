<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="container nav-container">

        <!-- Logo -->
        <a href="/" class="logo" aria-label="FreshJaipur Home">

            <span class="logo-icon">
                <i class="fa-solid fa-leaf"></i>
            </span>

            <span class="logo-text">
                Fresh<span>Jaipur</span>
            </span>

        </a>


        <!-- Navigation -->
        <nav class="nav-links" id="main-navigation">

            <a href="/" class="active">
                Home
            </a>

            <a href="/vegetables/">
                Vegetables
            </a>

            <a href="/mala/">
                Bulk Mala
            </a>

            <a href="/guides/">
                Guides
            </a>

            <a href="/about/">
                About
            </a>

            <a href="/contact/">
                Contact
            </a>

        </nav>


        <!-- Navbar Actions -->
        <div class="nav-actions">

            <!-- Search -->
            <button
                type="button"
                class="search-btn"
                aria-label="Search"
            >
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>


            <!-- Cart -->
            <a
                href="/cart/"
                class="cart-btn"
                aria-label="Shopping Cart"
            >

                <i class="fa-solid fa-cart-shopping"></i>

                <span class="cart-count">
                    0
                </span>

            </a>


            <!-- Mobile Menu -->
            <button
                type="button"
                class="menu-btn"
                id="menu-btn"
                aria-label="Open navigation menu"
                aria-controls="main-navigation"
                aria-expanded="false"
            >

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </div>

</header>
